name: CI

# Locks the offline test suite green on every push/PR. No secrets/keys needed —
# tests mock the LLM + browser backend, so this runs anywhere.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Real-process graceful-shutdown check. On this ubuntu runner SIGTERM is catchable,
      # so the assertion actually runs (it self-skips only on Windows). Needs the build.
      - run: npm run build
      - run: node scripts/e2e-shutdown.mjs
